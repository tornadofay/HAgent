name: Verify 0.9575 Slice 12

on:
  push:
    branches: [ master ]
    paths:
      - 'src/HAgent.WinForms/**'
      - 'src/HAgent.Core/**'
      - 'src/HAgent.Storage.File/**'
      - 'src/HAgent.Example/**'
      - 'tests/HAgent.Tests/**'
      - 'docs/architecture/93-learning-review-management-ui.md'
      - 'docs/plan/**'
      - 'docs/roadmap/9575-resource-governance-learning.md'
      - '.github/workflows/verify-phase-0-9575-slice-12.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
      - name: Restore
        run: dotnet restore HAgent.sln
      - name: Build WinForms (.NET Framework 4.8.1)
        run: dotnet build src/HAgent.WinForms/HAgent.WinForms.csproj --configuration Release --framework net481 --no-restore
      - name: Build WinForms (.NET 9 Windows)
        run: dotnet build src/HAgent.WinForms/HAgent.WinForms.csproj --configuration Release --framework net9.0-windows --no-restore
      - name: Build Example (.NET Framework 4.8.1)
        run: dotnet build src/HAgent.Example/HAgent.Example.csproj --configuration Release --framework net481 --no-restore
      - name: Build Example (.NET 9 Windows)
        run: dotnet build src/HAgent.Example/HAgent.Example.csproj --configuration Release --framework net9.0-windows --no-restore
      - name: Run full test suite (.NET 9)
        run: dotnet test tests/HAgent.Tests/HAgent.Tests.csproj --configuration Release --framework net9.0 --no-restore
