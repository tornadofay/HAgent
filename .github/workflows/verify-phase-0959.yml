name: Verify phase 0.959

on:
  push:
    branches:
      - codex/phase-0.959-intervention
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Build solution
        run: dotnet build HAgent.sln -c Release

      - name: Run tests
        run: dotnet test tests/HAgent.Tests/HAgent.Tests.csproj -c Release --no-build
