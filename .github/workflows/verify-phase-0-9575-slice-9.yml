name: Verify 0.9575 Slice 9

on:
  push:
    branches:
      - master
    paths:
      - 'src/HAgent.Core/**'
      - 'src/HAgent.Storage.File/**'
      - 'src/HAgent.Example/**'
      - 'tests/HAgent.Tests/**'
      - 'docs/architecture/88-learning-candidate-persistence.md'
      - 'docs/plan/**'
      - 'docs/roadmap/9575-resource-governance-learning.md'
      - '.github/workflows/verify-phase-0-9575-slice-9.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore HAgent.sln

      - name: Build Core (.NET Framework 4.8.1)
        run: dotnet build src/HAgent.Core/HAgent.Core.csproj --configuration Release --framework net481 --no-restore

      - name: Build Core (.NET 9)
        run: dotnet build src/HAgent.Core/HAgent.Core.csproj --configuration Release --framework net9.0 --no-restore

      - name: Build File storage (.NET Framework 4.8.1)
        run: dotnet build src/HAgent.Storage.File/HAgent.Storage.File.csproj --configuration Release --framework net481 --no-restore

      - name: Build File storage (.NET 9)
        run: dotnet build src/HAgent.Storage.File/HAgent.Storage.File.csproj --configuration Release --framework net9.0 --no-restore

      - name: Build Example (.NET Framework 4.8.1)
        run: dotnet build src/HAgent.Example/HAgent.Example.csproj --configuration Release --framework net481 --no-restore

      - name: Build Example (.NET 9 Windows)
        run: dotnet build src/HAgent.Example/HAgent.Example.csproj --configuration Release --framework net9.0-windows --no-restore

      - name: Run focused learning persistence tests
        run: dotnet test tests/HAgent.Tests/HAgent.Tests.csproj --configuration Release --framework net9.0 --no-restore --filter FullyQualifiedName~LearningCandidatePersistenceTests

      - name: Run full test suite (.NET 9)
        run: dotnet test tests/HAgent.Tests/HAgent.Tests.csproj --configuration Release --framework net9.0 --no-restore
